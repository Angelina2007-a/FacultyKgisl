<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KITE</title>
    <style>
        *{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body{
    margin: 0;
}

nav{
    width: 100%;
    background-color: rgb(9, 9, 91);
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 50px;
    padding: 15px 40px;
    position: sticky;
    top: 0;
    z-index: 100;
}

nav a{
    color: white;
    text-decoration: none;
    font-size: 20px;
}
        html{
            scroll-behavior: smooth;
        }
        h1{
            color: rgb(9, 9, 91);
            text-align: center;
            margin: 20px;
        }
        nav a:hover{
            color:rgb(255, 255, 193);
        }
        #home{
            position:relative;
            min-height: 100vh;
            display:flex;
            flex-direction: column;
            justify-content: flex-start;
            padding:5px;
            color: ghostwhite;
            overflow:hidden;
            padding-top:0px;
        }
        #home h2{
            text-align:center;
            margin:10px;
            padding-top: 0px;
            color:rgb(249, 249, 251);
        }
        #home img{
            position:absolute;
            top: 0;
            object-fit: cover;
            left: 0;
            width:100%;
            height:100%;
            z-index:-2;
        }
        #department h1{
            text-align:center;
            margin:10px;
            color:rgb(9, 9, 91);

        }
        #department h3{
    text-align: center;
    color: rgb(9, 9, 91);
    font-size: 35px;
    margin: 30px 0;
}

.faculties{
    display: flex;
    justify-content: center;
    gap: 40px;          /* Space between cards */
    flex-wrap: wrap;    /* Moves to next line on small screens */
    padding: 20px;
}

.faculty-card{
    width: 250px;
    text-align: center;
}

.faculty-card img{
    width: 100%;
    height: 300px;
    object-fit: cover;
    border-radius: 15px;
}

.faculty-card button{
    width: 100%;
    margin-top: 10px;
    padding: 10px;
    border: none;
    background-color: rgb(9, 9, 91);
    color: white;
    font-size: 18px;
    border-radius: 8px;
    cursor: pointer;
}
.faculty-card button:hover{
    transform: scale(1.1);
    transition: 0.5s;
}


    </style>
</head>
<body>
    <h1>KGISL INSTITUTE OF TECHNOLOGY</h1>
    <nav>
        <a href="#home">Home</a>
        <a href="#department">Department</a>
        <a href="#course">Course</a>
        <a href="#placements">Placements</a>
    </nav>
    <section id="home">
        <h2>Welcome to KGISL Institute of Technology!</h2>
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ8_lQfmTAy8pm41tSpL2BHk4zNwNpv591H3QItW2k5Ig&s=10" alt="kgimage">
    </section>
    <section id="department">
    <h3>DEPARTMENT FACULTIES</h3>

    <div class="faculties">
        <div class="faculty-card">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSAdl2yAs3x0OauvILH7esutBOMei5LXzd8ZVBcfkgPIaOfK8APHbu4RgPr&s=10" alt="Dr. J. Nirmaladevi">
            <button>DR. J. NIRMALADEVI</button>
        </div>

        <div class="faculty-card">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTi_PPkm-VQuIpkhrh7yR8JsgDrx0wwaDBaOqPYgRpPxw&s=10" alt="Ms. Aruna">
            <button>Ms. ARUNA</button>
        </div>

        <div class="faculty-card">
            <img src="https://www.kgkite.ac.in/wp-content/uploads/2026/01/WhatsApp-Image-2026-02-02-at-16.44.26.jpeg" alt="Ms.Kowsalya">
            <button>Ms. KOWSALYA</button>
        </div>

        <div class="faculty-card">
            <img src="https://www.kgkite.ac.in/wp-content/uploads/2026/02/Pragathi-aiml.webp" alt="Ms.Pragathi">
            <button>Ms. PRAGATHI</button>
        </div>
    </div>
</section>
    
  
</body>
</html>
